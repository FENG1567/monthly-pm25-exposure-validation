[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm25-deployment-validation"
version = "0.1.0"
description = "Code and author-owned summary results for cross-country monthly PM2.5 deployment validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Shuo Feng"}, {name = "Xianzhi Meng", email = "mengxianzhi@hrbmu.edu.cn"}]
dependencies = ["numpy>=2.0", "pandas>=2.2", "matplotlib>=3.8", "scikit-learn>=1.4", "scipy>=1.12", "joblib>=1.3", "pyarrow>=16"]

[project.optional-dependencies]
geospatial = ["xarray", "netCDF4", "rasterio", "h5py", "requests"]

[project.scripts]
pm25-reproduce = "pm25_repro.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
